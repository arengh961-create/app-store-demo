<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин приложений — прототип</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6fa;--card:#fff;--tx:#161823;--mut:#6b7080;--ac:#2f6bff;--bd:#e3e5ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e29;--tx:#eef0f7;--mut:#9aa0b4;--ac:#5b8cff;--bd:#2c2f3d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.logo{font-weight:700;font-size:18px;color:var(--ac)}
input{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
main{max-width:900px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:17px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.app{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.ic{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:26px;flex:none}
.inf{flex:1;min-width:0}.inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf small{color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--ac),#8a5bff);color:#fff;border-radius:16px;padding:20px;margin-bottom:6px}
.hero p{margin:4px 0 0;opacity:.9}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:9}
.modal.on{display:grid}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px;display:grid;gap:10px}
.box button{width:100%}
.empty{color:var(--mut);padding:30px;text-align:center}
</style></head><body>
<header><span class="logo">Магазин</span><input id="q" placeholder="Поиск приложений"><button class="g" id="login">Войти</button></header>
<main>
<div class="hero"><b>Приложения, которых нет в зарубежных сторах</b><p>Банки, госуслуги, маркетплейсы, игры. Оплата российскими картами.</p></div>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
</main>
<div class="modal" id="m"><div class="box"><b>Вход в аккаунт</b>
<button data-id="VK ID">Войти через VK ID</button><button data-id="Sber ID">Войти через Sber ID</button><button data-id="Tinkoff ID">Войти через Tinkoff ID</button><button data-id="Yandex ID">Войти через Yandex ID</button>
<button class="g" id="skip">Продолжить без аккаунта</button></div></div>
<script>
const A=[
["Банк Онлайн","Банки","🏦","#1fa95b",1,"4.8"],["Мой счёт","Банки","💳","#2f6bff",0,"4.6"],["Госсервисы","Госуслуги","🏛️","#3b5bdb",1,"4.7"],["Налоги и платежи","Госуслуги","🧾","#0ca678",0,"4.5"],
["Маркет","Покупки","🛍️","#e03131",1,"4.7"],["Доставка за 15 минут","Покупки","🛵","#f08c00",1,"4.6"],["Соцсеть","Соцсети","💬","#1c7ed6",0,"4.4"],["Одноклассники","Соцсети","👥","#f76707",0,"4.3"],
["Онлайн-кинотеатр","Развлечения","🎬","#7048e8",1,"4.6"],["Музыка","Развлечения","🎧","#d6336c",0,"4.5"],["Пазл-аркада","Игры","🧩","#12b886",0,"4.2"],["Гонки 3D","Игры","🏎️","#fa5252",0,"4.4"],
["Сканер документов","Утилиты","📄","#495057",0,"4.5"],["Заметки","Утилиты","📝","#fab005",0,"4.3"]];
let cat="Все",inst={},user=null;const $=s=>document.querySelector(s);
const cats=["Все",...new Set(A.map(a=>a[1]))];
$("#tabs").innerHTML=cats.map(c=>`<button data-c="${c}">${c}</button>`).join("");
function card(a,i){const on=inst[i];return `<div class="app"><div class="ic" style="background:${a[3]}22">${a[2]}</div><div class="inf"><b>${a[0]}</b><small>${a[1]} · ★ ${a[5]}</small></div><button data-i="${i}" class="${on?"g":""}">${on?"Открыть":"Скачать"}</button></div>`}
function draw(){
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.c===cat));
 const t=$("#q").value.toLowerCase().trim();
 const L=A.map((a,i)=>[a,i]).filter(([a])=>(cat==="Все"||a[1]===cat)&&a[0].toLowerCase().includes(t));
 let h="";
 if(cat==="Все"&&!t){h+=`<h2>Интересное</h2><div class="grid">${L.filter(([a])=>a[4]).map(([a,i])=>card(a,i)).join("")}</div><h2>Все приложения</h2>`}
 h+=L.length?`<div class="grid">${L.map(([a,i])=>card(a,i)).join("")}</div>`:`<div class="empty">Ничего не найдено</div>`;
 $("#out").innerHTML=h}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;draw()}
 else if(b.dataset.i!==undefined){const i=b.dataset.i;if(inst[i])return;b.textContent="Установка…";setTimeout(()=>{inst[i]=1;draw()},900)}
 else if(b.id==="login"){$("#m").classList.add("on")}
 else if(b.dataset.id){user=b.dataset.id;$("#login").textContent="✓ "+user;$("#m").classList.remove("on")}
 else if(b.id==="skip"){$("#m").classList.remove("on")}});
$("#q").addEventListener("input",draw);draw();
</script></body></html>
